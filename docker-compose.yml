version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: yatrasetu-postgres
    restart: always
    environment:
      # These credentials match the default .env.example
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_db_password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
